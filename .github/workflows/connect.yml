name: Connect Telegram bot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connect-telegram
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register and verify private webhook
        env:
          BOT_BACKEND_URL: ${{ secrets.BOT_BACKEND_URL }}
          BOT_RUNNER_TOKEN: ${{ secrets.BOT_RUNNER_TOKEN }}
        run: python scripts/connect_backend.py
