name: Check email inboxes
on:
  schedule:
    # Recovery checks only; EWS callbacks trigger normal delivery immediately.
    # Offset from the top of the hour to reduce scheduled-run congestion.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Explicitly check and deliver now, even outside work hours'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: email-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: poller/requirements.txt
      - run: pip install -r poller/requirements.txt
      - name: Poll and deliver
        env:
          BOT_BACKEND_URL: ${{ secrets.BOT_BACKEND_URL }}
          BOT_RUNNER_TOKEN: ${{ secrets.BOT_RUNNER_TOKEN }}
          EWS_AUTH_TYPE: ${{ vars.EWS_AUTH_TYPE || 'NTLM' }}
          MANUAL_FORCE: ${{ inputs.force }}
        run: |
          if [ "$MANUAL_FORCE" = "true" ]; then
            python -m poller.run --force
          else
            python -m poller.run
          fi
