name: First connection check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: email-poll
  cancel-in-progress: false
jobs:
  initial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: poller/requirements.txt
      - run: pip install -r poller/requirements.txt
      - name: Check newly connected accounts
        env:
          BOT_BACKEND_URL: ${{ secrets.BOT_BACKEND_URL }}
          BOT_RUNNER_TOKEN: ${{ secrets.BOT_RUNNER_TOKEN }}
          EWS_AUTH_TYPE: ${{ vars.EWS_AUTH_TYPE || 'NTLM' }}
          EWS_DIAGNOSTICS: 'true'
        run: python -m poller.run --initial
