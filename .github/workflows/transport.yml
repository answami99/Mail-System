name: Test serverless authentication compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: email-poll
  cancel-in-progress: false
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: poller/requirements.txt
      - run: pip install -r poller/requirements.txt
      - name: Test HTTPS Basic authentication and streaming subscription
        env:
          BOT_BACKEND_URL: ${{ secrets.BOT_BACKEND_URL }}
          BOT_RUNNER_TOKEN: ${{ secrets.BOT_RUNNER_TOKEN }}
          EWS_AUTH_TYPE: BASIC
        run: python -m poller.realtime --capability-only
      - name: Restore the verified NTLM unread scanner
        if: ${{ always() }}
        env:
          BOT_BACKEND_URL: ${{ secrets.BOT_BACKEND_URL }}
          BOT_RUNNER_TOKEN: ${{ secrets.BOT_RUNNER_TOKEN }}
          EWS_AUTH_TYPE: NTLM
        run: python -m poller.run --force
