name: Test realtime notifications
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: email-poll
  cancel-in-progress: false
jobs:
  streaming:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BOT_BACKEND_URL: ${{ secrets.BOT_BACKEND_URL }}
      BOT_RUNNER_TOKEN: ${{ secrets.BOT_RUNNER_TOKEN }}
      EWS_AUTH_TYPE: ${{ vars.EWS_AUTH_TYPE || 'NTLM' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: poller/requirements.txt
      - run: pip install -r poller/requirements.txt
      - name: Verify streaming subscription support
        run: python -m poller.realtime --capability-only
      - name: Listen for a new email for five minutes
        run: python -m poller.realtime --minutes 5
      - name: Restore normal mailbox check status
        if: ${{ always() }}
        run: python -m poller.run --force
